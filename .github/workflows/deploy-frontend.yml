# 画面（Blazor WebAssembly）を Cloudflare Pages に公開する（012）。手順は docs/DEPLOY.md
# 必要な設定（GitHub の Settings → Secrets and variables → Actions）:
#   Secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   Variables: CLOUDFLARE_PAGES_PROJECT（Pages のプロジェクト名）, API_BASE_ADDRESS（例: https://xxx.onrender.com）
name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  deploy:
    # 公開の設定をしていないリポジトリでは何もしない
    if: vars.CLOUDFLARE_PAGES_PROJECT != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish
        run: dotnet publish frontend/GamifiedMathDrill.Client -c Release -o publish

      # 画面が使う API のアドレスを書き込む。Blazor はビルド時にあった設定ファイルしか読まないため、
      # appsettings.Production.json を足すのではなく appsettings.json を書き換え、古い圧縮版（.br/.gz）は消す
      - name: Write API address
        env:
          API_BASE_ADDRESS: ${{ vars.API_BASE_ADDRESS }}
        run: |
          test -n "$API_BASE_ADDRESS" || { echo "API_BASE_ADDRESS が設定されていません"; exit 1; }
          printf '{\n  "ApiBaseAddress": "%s"\n}\n' "$API_BASE_ADDRESS" > publish/wwwroot/appsettings.json
          rm -f publish/wwwroot/appsettings.json.br publish/wwwroot/appsettings.json.gz

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy publish/wwwroot --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
