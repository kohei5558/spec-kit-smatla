name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet restore backend/GamifiedMathDrill.sln
          dotnet restore frontend/GamifiedMathDrill.Client

      - name: Build backend
        run: dotnet build backend/GamifiedMathDrill.sln --no-restore

      # モデルの変更がマイグレーションに反映されているか（未反映だと本番起動時に例外になる）
      - name: Check migrations are up to date
        run: |
          dotnet tool restore
          # CI には開発用の User Secrets がないため、設計時だけ使うダミーの鍵を渡す
          ASPNETCORE_ENVIRONMENT=Development \
          Jwt__SecretKey=ci-design-time-only-key-ci-design-time-only-key \
            dotnet ef migrations has-pending-model-changes --no-build \
            --project backend/src/GamifiedMathDrill.Migrations.Sqlite \
            --startup-project backend/src/GamifiedMathDrill.Api
          ASPNETCORE_ENVIRONMENT=Production DatabaseProvider=PostgreSQL \
          Jwt__SecretKey=ci-design-time-only-key-ci-design-time-only-key \
          ConnectionStrings__DefaultConnection="Host=localhost;Database=design" \
            dotnet ef migrations has-pending-model-changes --no-build \
            --project backend/src/GamifiedMathDrill.Migrations.PostgreSQL \
            --startup-project backend/src/GamifiedMathDrill.Api

      - name: Build frontend
        run: dotnet build frontend/GamifiedMathDrill.Client --no-restore

      - name: Test
        run: dotnet test backend/GamifiedMathDrill.sln --no-build --logger "console;verbosity=normal"

  # 画面の流れの自動テスト（018）。本物の API と画面を起動して Playwright で動かす。上のジョブと同時に動く
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # 先にビルドしておき、テストの中でのサーバー起動を速くする
      - name: Build
        run: |
          dotnet build ../backend/src/GamifiedMathDrill.Api
          dotnet build ../frontend/GamifiedMathDrill.Client

      - name: E2E
        run: npx playwright test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
